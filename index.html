<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiVolt — строительство объектов электроснабжения</title>
<meta name="description" content="ТОО «HiVolt» — строительство линий электропередачи и подстанций 0,4–220 кВ в Казахстане с 2008 года.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#05435c; --navy-2:#0a5f7d; --ink:#0a2a38; --orange:#f39a0b; --orange-2:#ffc02e; --cyan:#05b3d3;
  --bg:#f5f7f8; --line:#dfe5e8; --muted:#5d6f78; --white:#fff;
  --r:14px; --fh:Montserrat,Inter,system-ui,sans-serif; --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.num{font-family:Montserrat,Inter,sans-serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* header */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:40px;width:auto}
.menu{display:flex;gap:24px;margin-left:auto;font-weight:500;font-size:15px}
.menu a{color:var(--muted);transition:color .2s}
.menu a:hover{color:var(--navy)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.langs button{border:0;background:none;font:600 13px Inter;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--navy);color:#fff}
.burger{display:none;margin-left:auto;background:none;border:0;cursor:pointer;padding:8px}
.burger span{display:block;width:24px;height:2px;background:var(--navy);margin:5px 0}

/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;color:#fff;overflow:hidden;padding:120px 0 80px}
.hero::before{content:"";position:absolute;inset:0;background:url(img/hero.jpg) center/cover no-repeat;transform:scale(1.03)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(4,38,54,.95) 0%,rgba(4,48,68,.82) 45%,rgba(5,67,92,.3) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-2)}
.tag::before{content:"";width:28px;height:2px;background:var(--orange)}
.hero h1{font-size:clamp(34px,5.2vw,64px);line-height:1.08;font-weight:800;margin:18px 0 20px;max-width:820px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange-2),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);max-width:600px;color:#d5e0e5}
.volts{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 36px}
.volts i{font-style:normal}
.volts span{border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:7px 14px;font:700 15px var(--fh);background:rgba(255,255,255,.06)}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:600;padding:15px 26px;border-radius:10px;transition:transform .15s,background .2s;font-size:15px}
.btn:hover{transform:translateY(-2px)}
.btn-o{background:var(--orange);color:#fff}
.btn-o:hover{background:var(--orange-2)}
.btn-g{border:1px solid rgba(255,255,255,.4);color:#fff}
.btn-g:hover{background:rgba(255,255,255,.1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.14);border-radius:var(--r);overflow:hidden;margin-top:64px;max-width:900px}
.stats>div{background:rgba(4,38,54,.72);padding:22px 24px}
.num{font-size:clamp(28px,3.4vw,40px);font-weight:800;color:#fff;line-height:1}
.num small{color:var(--orange);font-size:.7em}
.stats p{color:#b7c7ce;font-size:14px;margin-top:6px}

/* sections */
section{padding:100px 0}
.alt{background:var(--bg)}
.head{max-width:720px;margin-bottom:48px}
.head h2{font-size:clamp(28px,3.4vw,42px);line-height:1.15;font-weight:800;margin:12px 0 14px;color:var(--navy)}
.head p{color:var(--muted);font-size:17px}
.tag.dark{color:var(--orange)}

/* about */
.about{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.about-img{position:relative}
.about-img img{border-radius:var(--r);aspect-ratio:4/3;object-fit:cover;width:100%}
.about-img .badge{position:absolute;right:-18px;bottom:-24px;background:var(--orange);color:#fff;border-radius:var(--r);padding:20px 24px;box-shadow:0 18px 40px rgba(243,154,11,.35)}
.badge .num{color:#fff}
.badge p{font-size:13px;font-weight:600;opacity:.95}
.about ul{list-style:none;margin-top:26px;display:grid;gap:14px}
.about li{display:flex;gap:14px;align-items:flex-start}
.about li b{display:block;color:var(--navy)}
.about li span{color:var(--muted);font-size:15px}
.ico{flex:none;width:40px;height:40px;border-radius:10px;background:#e3f5f9;color:var(--navy-2);display:grid;place-items:center}
.ico svg{width:22px;height:22px}

/* services */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--orange);transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,48,61,.08)}
.card .ico{width:52px;height:52px;margin-bottom:18px;background:linear-gradient(135deg,var(--cyan),var(--navy));color:#fff}
.card .ico svg{width:26px;height:26px}
.card h3{font-size:18px;color:var(--navy);margin-bottom:8px;line-height:1.3}
.card p{color:var(--muted);font-size:15px}

/* production */
.prod{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.prod-box{background:var(--navy);color:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:200px}
.prod-pics img{width:100%;height:200px;min-height:0;object-fit:cover}
.prod-body{padding:30px}
.prod-body h3{font-size:22px;margin-bottom:16px}
.prod-body ul{list-style:none;display:grid;gap:10px}
.prod-body li{padding-left:22px;position:relative;color:#d2dde2}
.prod-body li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;background:var(--orange);transform:rotate(45deg)}

/* projects */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Inter;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.proj{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start}
.proj .yr{grid-row:span 2;font:800 15px var(--fh);color:var(--navy);background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center;min-width:92px}
.proj .yr.live{background:#fff4dc;color:#c27400}
.proj h3{font:600 16px/1.4 Inter;color:var(--ink)}
.proj p{font-size:14px;color:var(--muted)}
.more{margin-top:26px;color:var(--muted);font-size:15px}
.more b{color:var(--navy)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:12px;grid-auto-flow:dense}
.gal button{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#ccd}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal button:hover img{transform:scale(1.06)}
.gal .w2{grid-column:span 2}
.gal .h2{grid-row:span 2}

/* docs */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.docs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:zoom-in;transition:box-shadow .2s,border-color .2s}
.docs button:hover{border-color:var(--orange);box-shadow:0 10px 26px rgba(20,48,61,.1)}
.docs img{aspect-ratio:3/4;object-fit:cover;object-position:top;width:100%;border-radius:4px}
.docs span{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-top:8px;text-align:left}

/* contacts */
.contact{background:linear-gradient(135deg,#04324a,var(--navy));color:#fff;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border:60px solid rgba(255,192,46,.08);border-radius:50%}
.contact .head h2{color:#fff}
.contact .head p{color:#b7c7ce}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;position:relative}
.cbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:10px}
.cbox .ico{background:var(--orange);color:#fff;width:48px;height:48px}
.cbox small{color:#9fb3bb;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-top:6px}
.cbox .val{font:700 19px/1.35 var(--fh);word-break:break-word}
.cbox .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.cbox .links a{color:var(--orange-2);font-weight:600;font-size:14px}
.cbox .links a:hover{text-decoration:underline}

footer{background:#03283a;color:#8aa0a9;font-size:14px;padding:26px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px 28px;flex-wrap:wrap}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,14,19,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:40px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb button{position:absolute;background:rgba(255,255,255,.1);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
.lb button:hover{background:var(--orange)}
.lb .x{top:18px;right:18px}.lb .pv{left:18px;top:50%;transform:translateY(-50%)}.lb .nx{right:18px;top:50%;transform:translateY(-50%)}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}

@media (max-width:1000px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .about,.prod{grid-template-columns:1fr}
  .about-img .badge{right:16px}
  .plist{grid-template-columns:1fr}
  .gal{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}
  .cgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .menu{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;flex-direction:column;padding:16px 24px 22px;gap:14px;border-bottom:1px solid var(--line);margin:0}
  .menu.open{display:flex}
  .burger{display:block}
  .langs{margin-left:0}
  .nav{gap:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  section{padding:72px 0}
}
@media (max-width:520px){
  .cards{grid-template-columns:1fr}
  .logo img{height:28px}
  .langs button{padding:6px 8px}
  .gal .w2{grid-column:span 2}
  .proj{grid-template-columns:1fr}
  .proj .yr{grid-row:auto;justify-self:start}
}
</style>
</head>

const DOCS=[["c1","lic"],["c2","lic"],["c3","lic"],["c4","cert"],["c5","cert"],["c6","cert"],["c7","cert"],["c8","cert"],["c9","cert"]];

let lang="ru",filt="all";
try{const s=localStorage.getItem("hv_lang");if(T[s])lang=s}catch(e){}

const yrs=new Date().getFullYear()-2008-(new Date().getMonth()<7?1:0);
document.querySelectorAll(".yrs").forEach(e=>e.textContent=yrs);
document.getElementById("yr").textContent=new Date().getFullYear();

function renderProjects(){
  const L=T[lang];
  document.getElementById("plist").innerHTML=P.filter(p=>filt==="all"||(filt==="live"?p.live:p.c===filt)).map(p=>
    `<div class="proj"><div class="yr ${p.live?'live':''}">${p.live?p.y+'<br><small>'+L.live+'</small>':p.y}</div><h3>${p[lang][0]}</h3><p>${p[lang][1]}</p></div>`).join("");
}
function renderDocs(){
  const L=T[lang];
  document.getElementById("docsgrid").innerHTML=DOCS.map((d,i)=>`<button data-lb="docs" data-k="${i}"><img src="img/${d[0]}.jpg" alt="${L[d[1]]}"><span>${L[d[1]]}</span></button>`).join("");
}
function setLang(l){
  lang=l;const L=T[l];
  document.documentElement.lang=l==="kk"?"kk":l;
  document.title=L.title;
  document.querySelectorAll("[data-i]").forEach(e=>{const v=L[e.dataset.i];if(v!=null)e.innerHTML=v});
  document.querySelectorAll("[data-list]").forEach(e=>e.innerHTML=L[e.dataset.list].map(x=>`<li>${x}</li>`).join(""));
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  renderProjects();renderDocs();
  try{localStorage.setItem("hv_lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.getElementById("filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filt=b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));renderProjects()};

document.getElementById("gal").innerHTML=GAL.map((g,i)=>`<button class="${g[1]||''}" data-lb="gal" data-k="${i}"><img src="img/${g[0]}.jpg" alt="HiVolt"></button>`).join("");

// menu
const menu=document.getElementById("menu");
document.getElementById("burger").onclick=()=>menu.classList.toggle("open");
menu.onclick=e=>{if(e.target.tagName==="A")menu.classList.remove("open")};

// copy email
document.getElementById("copymail").onclick=async e=>{e.preventDefault();const a=e.currentTarget;
  try{await navigator.clipboard.writeText("hivolt1606@gmail.com");a.textContent=T[lang].copied;setTimeout(()=>a.textContent=T[lang].copy,1800)}catch(_){}};

// lightbox
const lb=document.getElementById("lb"),lbimg=document.getElementById("lbimg");let set=[],idx=0;
function show(){lbimg.src="img/"+set[idx][0]+".jpg"}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");if(!b)return;
  set=b.dataset.lb==="gal"?GAL:DOCS;idx=+b.dataset.k;show();lb.classList.add("on")});
lb.querySelector(".x").onclick=()=>lb.classList.remove("on");
lb.querySelector(".pv").onclick=e=>{e.stopPropagation();idx=(idx-1+set.length)%set.length;show()};
lb.querySelector(".nx").onclick=e=>{e.stopPropagation();idx=(idx+1)%set.length;show()};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove("on")};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;
  if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")lb.querySelector(".pv").click();if(e.key==="ArrowRight")lb.querySelector(".nx").click()});

// reveal
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

setLang(lang);
</script>
</body>
</html>
